name: faceimob-services
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SERVER_URL: ${EVOLUTION_URL:?}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?}@evolution-db:5432/evolution?schema=evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${EVOLUTION_REDIS_PASSWORD:?}@evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: faceimob
      CACHE_LOCAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      # O middleware desta versão também exige * para navegação sem Origin.
      CORS_ORIGIN: "*"
      LOG_LEVEL: ERROR,WARN,INFO,LOG
      LANGUAGE: pt-BR
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
  evolution-db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, evolution, -d, evolution]
      interval: 5s
      timeout: 5s
      retries: 20
  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${EVOLUTION_REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - evolution-redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      APP_URL: ${APP_URL:?}
      EVOLUTION_URL: ${EVOLUTION_URL}
    volumes:
      - ./Proxy.Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
volumes:
  evolution-instances:
  evolution-db:
  evolution-redis:
  proxy-data:
  proxy-config:
